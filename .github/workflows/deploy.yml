name: Deploy QuizBlitz

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

# OIDC token needed for the infra job (keyless AWS auth)
permissions:
  id-token: write
  contents: read

jobs:
  # ── Job 1: DynamoDB tables via CDK ──────────────────────────────────────
  infra:
    name: CDK – DynamoDB tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infra

      - name: CDK Bootstrap (idempotent)
        run: npx cdk bootstrap --ci --require-approval never
        working-directory: infra

      - name: CDK Deploy (tables only)
        run: npx cdk deploy --all --ci --require-approval never
        working-directory: infra

  # ── Job 2: App container via Fly.io ─────────────────────────────────────
  deploy:
    name: Fly.io – App deploy
    runs-on: ubuntu-latest
    needs: infra          # ensure tables exist before the app starts
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
